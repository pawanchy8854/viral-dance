<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
            apiKey: "AIzaSyBYdy0mGeOSrx59-dDdS9whEpKakuOgSlA",
            authDomain: "location-detector-25ab7.firebaseapp.com",
            databaseURL: "https://location-detector-25ab7-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "location-detector-25ab7",
            storageBucket: "location-detector-25ab7.firebasestorage.app",
            messagingSenderId: "717756663277",
            appId: "1:717756663277:web:4913e4e1fd58aa5bb613e4",
            measurementId: "G-8D3FXK2K3Y"
        };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Initialize map
    const map = L.map("map").setView([27.67, 85.32], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    let marker = null;

    // Listen for real-time updates
    onValue(ref(db, "devices/brother_phone"), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const { lat, lng, accuracy } = data;
      if (!marker) {
        marker = L.marker([lat, lng]).addTo(map);
      } else {
        marker.setLatLng([lat, lng]);
      }
      marker.bindPopup(`Accuracy: ±${accuracy}m`).openPopup();
      map.setView([lat, lng], 16);
    });
  </script>
</body>
</html>
